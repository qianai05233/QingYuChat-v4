<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QingYu Chat v4</title>
<link rel="stylesheet" href="src/css/main.css">
<link rel="stylesheet" href="src/css/chat.css">
</head>
<body>
<div id="app">

  <!-- ── 顶部导航 ── -->
  <nav id="top-nav">
    <div id="nav-brand" onclick="showAbout()">QY</div>
    <div id="nav-tabs">
      <div class="nav-tab active" data-page="chat"      onclick="switchTab(this)"><span class="ti">💬</span><span>聊天</span></div>
      <div class="nav-tab"        data-page="character" onclick="switchTab(this)"><span class="ti">👤</span><span>角色</span></div>
      <div class="nav-tab"        data-page="worldbook" onclick="switchTab(this)"><span class="ti">📖</span><span>世界书</span></div>
      <div class="nav-tab"        data-page="preset"    onclick="switchTab(this)"><span class="ti">🔓</span><span>预设</span></div>
      <div class="nav-tab"        data-page="regex"     onclick="switchTab(this)"><span class="ti">🔧</span><span>正则</span></div>
      <div class="nav-tab"        data-page="persona"   onclick="switchTab(this)"><span class="ti">🎭</span><span>人设</span></div>
      <div class="nav-tab"        data-page="plugins"   onclick="switchTab(this)"><span class="ti">🧩</span><span>插件</span></div>
      <div class="nav-tab"        data-page="settings"  onclick="switchTab(this)"><span class="ti">⚙️</span><span>设置</span></div>
    </div>
  </nav>

  <!-- ── 页面容器 ── -->
  <div id="pages">

    <!-- 聊天页 -->
    <div class="page active" id="page-chat">
      <!-- 角色信息栏 -->
      <div id="chat-char-bar">
        <div id="chat-char-avatar"></div>
        <div id="chat-char-info">
          <div id="chat-char-name">未选择角色</div>
          <div id="chat-char-status">选择角色开始对话</div>
        </div>
        <div id="chat-char-actions">
          <button class="btn btn-xs btn-ghost" onclick="openAuthorNoteModal()">📝</button>
          <button class="btn btn-xs btn-ghost" onclick="exportChat()">📤</button>
          <button class="btn btn-xs btn-danger" onclick="clearChat()">🗑️</button>
        </div>
      </div>
      <!-- Token 进度条 -->
      <div id="ctx-bar-wrap">
        <div id="ctx-bar"><div id="ctx-bar-fill"></div></div>
        <span id="ctx-info-txt" title="长按查看完整 Prompt" onclick="previewContext()"></span>
      </div>
      <!-- 消息区 -->
      <div id="chat-messages"></div>
      <!-- 输入区 -->
      <div id="chat-input-area">
        <div id="chat-action-btns">
          <button class="btn btn-xs btn-ghost" id="btn-continue"   onclick="continueGenerate()" style="display:none">↪继续</button>
          <button class="btn btn-xs btn-ghost" id="btn-regen"      onclick="regenLast()"        style="display:none">🔄重生</button>
          <button class="btn btn-xs btn-danger" id="btn-stop"      onclick="stopGenerate()"     style="display:none">⏹停止</button>
        </div>
        <div id="input-row">
          <textarea id="chat-input" placeholder="输入消息…" rows="1" onkeydown="inputKeyDown(event)" oninput="autoResize(this)"></textarea>
          <button class="btn btn-primary" id="btn-send" onclick="sendMessage()">发送</button>
        </div>
        <div id="chat-toolbar">
          <button class="btn btn-xs btn-ghost" onclick="triggerImpersonate()">🎭代入</button>
          <button class="btn btn-xs btn-ghost" onclick="openAuthorNoteModal()">📝作者注</button>
          <button class="btn btn-xs btn-ghost" onclick="speakLast()">🔊朗读</button>
          <button class="btn btn-xs btn-ghost" onclick="togglePluginBar()">🧩插件</button>
          <button class="btn btn-xs btn-ghost" onclick="openMsgSearch()">🔍搜索</button>
          <span id="msg-counter" class="badge badge-blue"></span>
        </div>
        <!-- 插件快捷栏（可展开） -->
        <div id="plugin-shortcut-bar" style="display:none"></div>
      </div>
    </div>

    <!-- 角色卡页 -->
    <div class="page" id="page-character">
      <div class="page-header">
        <span class="page-header-title">👤 角色卡</span>
        <div class="page-header-actions">
          <button class="btn btn-sm btn-ghost" onclick="triggerImportCard()">📥导入PNG</button>
          <button class="btn btn-sm btn-primary" onclick="triggerCreateChar()">＋新建</button>
        </div>
      </div>
      <div id="char-search-wrap" style="padding:6px 10px">
        <input type="text" placeholder="搜索角色…" oninput="filterChars(this.value)">
      </div>
      <div id="char-list"></div>
    </div>

    <!-- 世界书页 -->
    <div class="page" id="page-worldbook">
      <div class="page-header">
        <span class="page-header-title">📖 世界书</span>
        <div class="page-header-actions">
          <button class="btn btn-sm btn-ghost" onclick="importWb()">📥</button>
          <button class="btn btn-sm btn-ghost" onclick="exportWb()">📤</button>
          <button class="btn btn-sm btn-primary" onclick="newWbBook()">＋书</button>
        </div>
      </div>
      <div id="wb-book-tabs"></div>
      <div class="card" style="margin:6px 10px;padding:10px">
        <div class="field-group" style="display:flex;align-items:center;gap:10px;margin:0">
          <label class="field-label" style="margin:0;white-space:nowrap">扫描深度</label>
          <input type="number" id="wb-scan-depth" min="1" max="50" value="5" style="width:70px" onchange="saveWbScanDepth()">
          <button class="btn btn-sm btn-ghost" onclick="newWbEntry()">＋新建条目</button>
        </div>
      </div>
      <div id="wb-list"></div>
    </div>

    <!-- 预设页 -->
    <div class="page" id="page-preset">
      <div class="page-header">
        <span class="page-header-title">🔓 预设</span>
        <div class="page-header-actions">
          <button class="btn btn-sm btn-ghost" onclick="importPresetGroup()">📥</button>
          <button class="btn btn-sm btn-ghost" onclick="exportPresetGroup()">📤</button>
          <button class="btn btn-sm btn-primary" onclick="newPresetGroup()">＋组</button>
        </div>
      </div>
      <div id="preset-group-bar" style="padding:6px 10px;display:flex;gap:6px;align-items:center">
        <select id="preset-group-select" onchange="switchPresetGroup(this.value)" style="flex:1"></select>
        <button class="btn btn-sm btn-ghost" onclick="renamePresetGroup()">✏️</button>
        <button class="btn btn-sm btn-danger" onclick="deletePresetGroup()">🗑️</button>
      </div>
      <!-- 预设内嵌参数面板 -->
      <div id="preset-params-panel" class="card"></div>
      <!-- 提示词条目列表 -->
      <div id="preset-list"></div>
      <div style="padding:0 10px 10px">
        <button class="btn btn-ghost btn-full" onclick="newPresetItem()">＋ 添加提示词条目</button>
      </div>
    </div>

    <!-- 正则脚本页 -->
    <div class="page" id="page-regex">
      <div class="page-header">
        <span class="page-header-title">🔧 正则脚本</span>
        <div class="page-header-actions">
          <button class="btn btn-sm btn-primary" onclick="newRegexScript()">＋新建</button>
        </div>
      </div>
      <div id="regex-scope-filter" style="padding:6px 10px;display:flex;gap:6px">
        <button class="btn btn-xs badge-blue active-filter" onclick="filterRegex('all')">全部</button>
        <button class="btn btn-xs btn-ghost" onclick="filterRegex('global')">全局</button>
        <button class="btn btn-xs btn-ghost" onclick="filterRegex('preset')">预设</button>
        <button class="btn btn-xs btn-ghost" onclick="filterRegex('char')">角色</button>
      </div>
      <div id="regex-list"></div>
    </div>

    <!-- 人设页 -->
    <div class="page" id="page-persona">
      <div class="page-header">
        <span class="page-header-title">🎭 人设</span>
        <div class="page-header-actions">
          <button class="btn btn-sm btn-primary" onclick="savePersona()">保存</button>
        </div>
      </div>
      <div id="persona-override-banner" style="display:none"></div>
      <div class="card">
        <div class="field-group">
          <label class="field-label">用户名称 ({{user}})</label>
          <input type="text" id="persona-name" placeholder="用户">
        </div>
        <div class="field-group">
          <label class="field-label">用户描述 ({{persona}})</label>
          <textarea id="persona-desc" placeholder="描述你的角色…" rows="5"></textarea>
        </div>
        <div class="field-group">
          <label class="field-label">用户头像</label>
          <div style="display:flex;gap:8px;align-items:center">
            <div id="persona-avatar-preview" style="width:48px;height:48px;border-radius:50%;background:var(--bg-input);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px">👤</div>
            <button class="btn btn-sm btn-ghost" onclick="triggerPersonaAvatarUpload()">上传头像</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 插件页 -->
    <div class="page" id="page-plugins">
      <div class="page-header">
        <span class="page-header-title">🧩 插件</span>
        <div class="page-header-actions">
          <button class="btn btn-sm btn-ghost" onclick="syncPluginSources()">🔄同步</button>
          <button class="btn btn-sm btn-primary" onclick="openInstallPluginModal()">＋安装</button>
        </div>
      </div>
      <div id="plugin-list"></div>
    </div>

    <!-- 设置页 -->
    <div class="page" id="page-settings">
      <div class="page-header">
        <span class="page-header-title">⚙️ 设置</span>
        <div class="page-header-actions">
          <button class="btn btn-sm btn-primary" onclick="saveConfig()">保存</button>
        </div>
      </div>
      <!-- API 配置 -->
      <div class="card">
        <div class="card-title">API 配置</div>
        <div class="field-group">
          <label class="field-label">Base URL</label>
          <input type="url" id="cfg-baseurl" placeholder="https://api.openai.com/v1">
        </div>
        <div class="field-group">
          <label class="field-label">API Key</label>
          <input type="password" id="cfg-apikey" placeholder="sk-…">
        </div>
        <div class="field-group">
          <label class="field-label">模型</label>
          <select id="cfg-model"><option value="">— 请先获取模型 —</option></select>
          <input type="text" id="cfg-model-custom" placeholder="或手动输入模型名" style="margin-top:6px">
          <button class="btn btn-sm btn-ghost btn-full" onclick="fetchModels()" style="margin-top:6px">🔄 获取模型列表</button>
        </div>
      </div>
      <!-- 全局参数 -->
      <div class="card">
        <div class="card-title">全局默认参数</div>
        <div class="field-group">
          <label class="field-label">Temperature <span id="temp-val">0.8</span> <span id="temp-override-tag" class="badge badge-warn" style="display:none"></span></label>
          <div class="slider-row"><input type="range" id="cfg-temp" min="0" max="2" step="0.01" value="0.8" oninput="updateSliderVal('cfg-temp','temp-val',2)"></div>
        </div>
        <div class="field-group">
          <label class="field-label">Top P <span id="topp-val">1.0</span> <span id="topp-override-tag" class="badge badge-warn" style="display:none"></span></label>
          <div class="slider-row"><input type="range" id="cfg-topp" min="0" max="1" step="0.01" value="1" oninput="updateSliderVal('cfg-topp','topp-val',2)"></div>
        </div>
        <div class="field-group">
          <label class="field-label">Max Tokens <span id="maxtok-val">2048</span></label>
          <div class="slider-row"><input type="range" id="cfg-maxtok" min="256" max="32768" step="64" value="2048" oninput="updateSliderVal('cfg-maxtok','maxtok-val',0)"></div>
        </div>
        <div class="field-group">
          <label class="field-label">Context Size <span id="ctxsize-val">4096</span></label>
          <div class="slider-row"><input type="range" id="cfg-ctxsize" min="1024" max="128000" step="512" value="4096" oninput="updateSliderVal('cfg-ctxsize','ctxsize-val',0)"></div>
        </div>
        <div class="field-group">
          <label class="field-label">频率惩罚 <span id="freq-val">0.0</span></label>
          <div class="slider-row"><input type="range" id="cfg-freq" min="-2" max="2" step="0.01" value="0" oninput="updateSliderVal('cfg-freq','freq-val',2)"></div>
        </div>
        <div class="field-group">
          <label class="field-label">存在惩罚 <span id="pres-val">0.0</span></label>
          <div class="slider-row"><input type="range" id="cfg-pres" min="-2" max="2" step="0.01" value="0" oninput="updateSliderVal('cfg-pres','pres-val',2)"></div>
        </div>
        <div class="field-group">
          <label class="field-label">停止词（每行一个）</label>
          <textarea id="cfg-stop" rows="3" placeholder="用户:"></textarea>
        </div>
      </div>
      <!-- 背景设置 -->
      <div class="card">
        <div class="card-title">自定义背景</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-sm btn-ghost" onclick="triggerBgUpload()">上传背景图</button>
          <button class="btn btn-sm btn-ghost" onclick="clearBg()">清除背景</button>
        </div>
        <div class="field-group" style="margin-top:10px">
          <label class="field-label">背景透明度 <span id="bg-opacity-val">0.5</span></label>
          <div class="slider-row"><input type="range" id="cfg-bg-opacity" min="0" max="1" step="0.01" value="0.5" oninput="applyBgOpacity(this.value)"></div>
        </div>
      </div>
      <!-- 数据管理 -->
      <div class="card">
        <div class="card-title">数据管理</div>
        <div id="storage-info" style="font-size:12px;color:var(--text-secondary);margin-bottom:10px"></div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <button class="btn btn-sm btn-ghost" onclick="exportAllData()">📦导出全部数据</button>
          <button class="btn btn-sm btn-ghost" onclick="importAllData()">📥导入备份</button>
          <button class="btn btn-sm btn-danger" onclick="clearAllData()">⚠️清除全部</button>
        </div>
      </div>
    </div>

  </div><!-- /pages -->

  <!-- ── 全局弹窗 ── -->

  <!-- 作者注释弹窗 -->
  <div class="modal-overlay" id="modal-author-note" onclick="closeModalOverlay(event,'modal-author-note')">
    <div class="modal-box">
      <div class="modal-title">📝 作者注释</div>
      <div class="field-group">
        <label class="field-label">注入内容</label>
        <textarea id="an-content" rows="5" placeholder="在此处输入对AI的实时指令…"></textarea>
      </div>
      <div class="field-group" style="display:flex;gap:10px;align-items:center">
        <label class="field-label" style="margin:0;white-space:nowrap">注入深度</label>
        <input type="number" id="an-depth" min="0" max="20" value="4" style="width:70px">
        <label class="field-label" style="margin:0">启用</label>
        <label class="toggle-wrap"><input type="checkbox" id="an-enabled" checked><span class="toggle-slider"></span></label>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="closeModal('modal-author-note')">取消</button>
        <button class="btn btn-primary" onclick="saveAuthorNote()">保存</button>
      </div>
    </div>
  </div>

  <!-- 角色详情弹窗 -->
  <div class="modal-overlay" id="modal-char-detail" onclick="closeModalOverlay(event,'modal-char-detail')">
    <div class="modal-box modal-box-large">
      <div class="modal-title" id="char-detail-title">角色详情</div>
      <div class="modal-tabs" id="char-detail-tabs">
        <button class="modal-tab active" onclick="switchCharTab(0)">基础</button>
        <button class="modal-tab" onclick="switchCharTab(1)">性格/场景</button>
        <button class="modal-tab" onclick="switchCharTab(2)">系统提示</button>
        <button class="modal-tab" onclick="switchCharTab(3)">示例对话</button>
        <button class="modal-tab" onclick="switchCharTab(4)">内嵌扩展</button>
      </div>
      <div id="char-detail-panels"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
        <button class="btn btn-ghost" onclick="closeModal('modal-char-detail')">关闭</button>
        <button class="btn btn-primary" onclick="saveCharDetail()">保存</button>
      </div>
    </div>
  </div>

  <!-- 世界书条目编辑弹窗 -->
  <div class="modal-overlay" id="modal-wb-entry" onclick="closeModalOverlay(event,'modal-wb-entry')">
    <div class="modal-box">
      <div class="modal-title">📖 编辑条目</div>
      <div class="field-group">
        <label class="field-label">条目名称</label>
        <input type="text" id="wb-entry-name" placeholder="条目名称">
      </div>
      <div class="field-group">
        <label class="field-label">触发关键词</label>
        <div id="wb-keywords-wrap"></div>
        <input type="text" id="wb-keyword-input" placeholder="输入关键词后按回车" onkeydown="addKeyword(event)">
      </div>
      <div class="field-group">
        <label class="field-label">注入内容</label>
        <textarea id="wb-entry-content" rows="6" placeholder="支持宏变量 {{char}} {{user}} 等"></textarea>
      </div>
      <div class="field-group" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <label class="field-label" style="margin:0">注入位置</label>
        <select id="wb-entry-pos">
          <option value="before_char_def">角色定义前</option>
          <option value="after_char_def">角色定义后</option>
          <option value="before_example">示例对话前</option>
          <option value="top">顶部</option>
          <option value="bottom">底部</option>
        </select>
        <label class="field-label" style="margin:0">始终注入</label>
        <label class="toggle-wrap"><input type="checkbox" id="wb-entry-always"><span class="toggle-slider"></span></label>
        <label class="field-label" style="margin:0">启用</label>
        <label class="toggle-wrap"><input type="checkbox" id="wb-entry-enabled" checked><span class="toggle-slider"></span></label>
      </div>
      <div style="display:flex;gap:8px;justify-content:space-between;margin-top:8px">
        <button class="btn btn-danger btn-sm" onclick="deleteWbEntry()">删除</button>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost" onclick="closeModal('modal-wb-entry')">取消</button>
          <button class="btn btn-primary" onclick="saveWbEntry()">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 正则脚本编辑弹窗 -->
  <div class="modal-overlay" id="modal-regex" onclick="closeModalOverlay(event,'modal-regex')">
    <div class="modal-box">
      <div class="modal-title">🔧 编辑正则脚本</div>
      <div class="field-group">
        <label class="field-label">名称</label>
        <input type="text" id="regex-name" placeholder="脚本名称">
      </div>
      <div class="field-group">
        <label class="field-label">作用域</label>
        <select id="regex-scope">
          <option value="global">全局</option>
          <option value="preset">预设</option>
          <option value="char">角色</option>
        </select>
      </div>
      <div class="field-group">
        <label class="field-label">匹配模式（正则表达式）</label>
        <input type="text" id="regex-pattern" placeholder="\\*\\*(.+?)\\*\\*">
      </div>
      <div class="field-group">
        <label class="field-label">替换内容（支持 $1 分组引用）</label>
        <input type="text" id="regex-replace" placeholder="$1">
      </div>
      <div class="field-group" style="display:flex;gap:16px;flex-wrap:wrap;align-items:center">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px">
          <label class="toggle-wrap"><input type="checkbox" id="regex-global" checked><span class="toggle-slider"></span></label> 全局(g)
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px">
          <label class="toggle-wrap"><input type="checkbox" id="regex-insensitive"><span class="toggle-slider"></span></label> 忽略大小写(i)
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px">
          <label class="toggle-wrap"><input type="checkbox" id="regex-enabled" checked><span class="toggle-slider"></span></label> 启用
        </label>
      </div>
      <div class="field-group">
        <label class="field-label">实时预览</label>
        <textarea id="regex-test-input" rows="3" placeholder="输入测试文本…" oninput="previewRegex()"></textarea>
        <div id="regex-preview-out" style="margin-top:6px;padding:8px;background:var(--bg-input);border-radius:6px;font-size:13px;color:var(--text-secondary);min-height:36px"></div>
      </div>
      <div style="display:flex;gap:8px;justify-content:space-between;margin-top:8px">
        <button class="btn btn-danger btn-sm" onclick="deleteRegexScript()">删除</button>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost" onclick="closeModal('modal-regex')">取消</button>
          <button class="btn btn-primary" onclick="saveRegexScript()">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 插件安装弹窗 -->
  <div class="modal-overlay" id="modal-install-plugin" onclick="closeModalOverlay(event,'modal-install-plugin')">
    <div class="modal-box">
      <div class="modal-title">🧩 安装插件</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn btn-ghost btn-full" onclick="installPluginByUrl()">🌐 直链 URL 安装</button>
        <button class="btn btn-ghost btn-full" onclick="addPluginSource()">➕ 添加插件源</button>
        <button class="btn btn-ghost btn-full" onclick="installPluginByFile()">📦 本地文件导入</button>
        <button class="btn btn-ghost btn-full" onclick="installPluginByCode()">📋 粘贴代码安装</button>
      </div>
      <button class="btn btn-ghost btn-full" style="margin-top:10px" onclick="closeModal('modal-install-plugin')">关闭</button>
    </div>
  </div>

  <!-- 上下文预览弹窗 -->
  <div class="modal-overlay" id="modal-ctx-preview" onclick="closeModalOverlay(event,'modal-ctx-preview')">
    <div class="modal-box">

<script>
  // ── 全局 UI 工具（各页面共用）──
  function switchTab(tabEl){
    document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    tabEl.classList.add('active');
    const page = document.getElementById('page-'+tabEl.dataset.page);
    if(page) page.classList.add('active');
    Bus.emit('ui:tab:changed', tabEl.dataset.page);
  }
  function switchTabById(key){
    const tab = document.querySelector(`.nav-tab[data-page="${key}"]`);
    if(tab) switchTab(tab);
  }
  function openModal(id){ document.getElementById(id).classList.add('open'); Bus.emit('ui:modal:opened',id); }
  function closeModal(id){ document.getElementById(id).classList.remove('open'); Bus.emit('ui:modal:closed',id); }
  function closeModalOverlay(e,id){ if(e.target===document.getElementById(id)) closeModal(id); }
  function showToast(msg, type='', dur=2400){
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'show '+(type||'');
    clearTimeout(t._t); t._t = setTimeout(()=>{ t.className=''; }, dur);
  }
  function updateSliderVal(sliderId, valId, dec){
    const v = parseFloat(document.getElementById(sliderId).value);
    document.getElementById(valId).textContent = v.toFixed(dec);
  }
  function showAbout(){ showToast('QingYu Chat v4 — 终极沉浸体验',''); }
  // 启动
  document.addEventListener('DOMContentLoaded', init);
</script>
